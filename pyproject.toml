[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-void"
version = "1.0.0"
description = "the Void - crystallography and porous-materials desktop software"
readme = "README.md"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Benyamin M. Garmejani"}]
requires-python = ">=3.11"

dependencies = [
    "PySide6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "vtk>=9.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "pymatgen>=2024.5",
    "matplotlib>=3.9",
    "rdkit>=2024.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Round 60: thevoid.load() of ASE Atoms, and BatchTable.to_dataframe().
api = ["ase>=3.23", "pandas>=2.0"]
# Round 61: the property models (the-void-train, --predict, predict()).
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
the-void = "thevoid_core.app.application:main"
the-void-analyze = "thevoid_core.cli:main"
the-void-fetch = "thevoid_core.fetch_cli:main"
the-void-figures = "thevoid_core.figures_cli:main"
the-void-functionalize = "thevoid_core.functionalize_cli:main"
the-void-train = "thevoid_core.train_cli:main"
the-void-index = "thevoid_core.index_cli:main"

# Explicit package list. Auto-discovery uses find_packages(), which skips
# any directory without an __init__.py; five subpackages were silently
# missing from the wheel before.
[tool.setuptools.packages.find]
include = ["thevoid_core*", "thevoid*"]

# Round 53: non-Python files the package reads at run time. Without
# this the wheel silently lacked the bundled RCSR nets (and the icons).
[tool.setuptools.package-data]
thevoid_core = ["data/*.json", "data/*.json.gz", "data/models/*/*", "assets/*.png", "assets/*.ico"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
